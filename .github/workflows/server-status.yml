# Outside-the-network half of the server status lights on the Computing
# Hardware page.
#
# This runner can reach gannet (public HTTPS) and klone (public SSH), but NOT
# raven directly, since raven is not in public DNS. Raven's up/down light is
# covered by the cron job inside the UW network -- see scripts/README.md.
# Running both means a dead internal prober does not take all three lights
# out at once. Raven's disk/CPU snapshot is a separate exception: it is
# fetched over public HTTPS from gannet, so this runner can see it too.
#
# GitHub's scheduled workflows are best-effort: they are delayed under load and
# are disabled automatically after 60 days without repo activity. That is why
# the in-network cron is the primary prober and this is the backstop.
name: server-status

on:
  schedule:
    - cron: "*/15 * * * *"
    # Gannet writes its daily health report at 03:00 Pacific. The 15-minute
    # runs above are often skipped for hours, so add a dedicated run shortly
    # after to pick up the new report. Cron is UTC, and 11:15 UTC lands after
    # 03:00 Pacific year-round (04:15 PDT, 03:15 PST).
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe public hosts and publish status
        run: |
          ./scripts/publish_status.sh \
            --profile external \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --workdir "${RUNNER_TEMP}/server-status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
